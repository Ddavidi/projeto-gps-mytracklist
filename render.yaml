services:
  - type: web
    name: mytracklist-api
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mytracklist-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /api/v1/health

databases:
  - name: mytracklist-db
    plan: free
    databaseName: mytracklist
    postgresMajorVersion: "16"
