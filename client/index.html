<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="MyTrackList" />

    <!-- Google Identity Services (Login / Cadastro com Google) -->

    <!-- SEO Meta Tags -->
    <title>MyTrackList — Seu diário musical e comunidade</title>
    <meta name="description" content="MyTrackList é a plataforma social para amantes de música. Avalie álbuns e faixas, monte seu diário musical e descubra o que a comunidade está ouvindo." />
    <meta name="keywords" content="música, avaliação, review, álbum, Spotify, comunidade musical, tracklist" />

    <!-- Open Graph -->
    <meta property="og:title" content="MyTrackList — Seu diário musical e comunidade" />
    <meta property="og:description" content="Avalie álbuns, registre o que você ouve e descubra novas músicas pela comunidade." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Tipografia Editorial: Bricolage Grotesque (Display) + Plus Jakarta Sans (UI/Body) + JetBrains Mono (Dados/Notas) -->

    />
